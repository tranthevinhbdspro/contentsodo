<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0a0d14"/>
    </radialGradient>
    <linearGradient id="soDoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="50%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Shield -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)" />
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="url(#goldGrad)" stroke-width="6" opacity="0.6" />

  <!-- Sổ Đỏ Certificate Red Badge -->
  <rect x="80" y="80" width="352" height="352" rx="48" fill="url(#soDoGrad)" filter="url(#glow)" />
  <rect x="96" y="96" width="320" height="320" rx="36" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-dasharray="12 6" opacity="0.85" />

  <!-- Mansion & Gold Star Emblem -->
  <g transform="translate(256, 235)">
    <!-- Roof -->
    <path d="M 0 -85 L 110 5 L 85 5 L 85 75 L -85 75 L -85 5 L -110 5 Z" fill="url(#goldGrad)" />
    <!-- Door -->
    <rect x="-24" y="15" width="48" height="60" rx="8" fill="#7f1d1d" />
    <!-- Golden Star in Roof -->
    <polygon points="0,-48 10,-24 35,-24 15,-10 22,14 0,-2 -22,14 -15,-10 -35,-24 -10,-24" fill="#ffffff" />
  </g>

  <!-- Text: CONTENT SỔ ĐỎ 2026 -->
  <text x="256" y="375" text-anchor="middle" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="900" letter-spacing="4">
    CONTENT SỔ ĐỎ
  </text>
  <text x="256" y="402" text-anchor="middle" fill="#fbbf24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="800" letter-spacing="3">
    PRO SUITE 2026
  </text>
</svg>